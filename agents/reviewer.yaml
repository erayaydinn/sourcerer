name: reviewer
role: reviewer
llm: ${SOURCERER_REVIEWER_LLM:-cursor-main}
model: ${SOURCERER_REVIEWER_MODEL:-}   # empty: the profile's own model
tools: [read_file, search_code, find_symbol, search_docs]
fileScope: { read: ["**"], write: [] }
maxTurns: 15
timeoutSec: 900
rag: { scope: [frontend, backend, contract] }
systemPrompt: |
  You are the reviewer. You are read-only.
  Review both diffs against the API contract together.
  Answer "approve" or "request-changes", followed by your comments.
  Judge new code against industry-standard best practices (modular, clean). Coders are told not to copy
  bad practices or outdated conventions from existing files, so do not flag new code just for differing from them.
