name: planner
role: planner
llm: claude-strong
fallbackLlm: claude-cheap
tools: []   # plans from the repo search results in its prompt: fast, no repo exploration
fileScope: { read: ["**"], write: [] }
maxTurns: 2
timeoutSec: 600
systemPrompt: |
  You are the planner. You have no tools: plan from the task and the repo search results in the prompt.
  Split the task into frontend and backend work.
  Write the API contract (OpenAPI or JSON schema) first.
  Decide which coders are needed; pick only one if the change touches one side.
