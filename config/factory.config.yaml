# Package defaults. Do not edit your settings here: put only what you change in your
# workspace's sourcerer.yaml (see `sourcerer init`, `sourcerer models`, `sourcerer use`).
# Precedence: --llm > .env / shell variables > sourcerer.yaml > these defaults.

# Repo paths come from SOURCERER_FRONTEND / SOURCERER_BACKEND (.env) or repos.<side>.path in sourcerer.yaml.
# base: branch new worktrees start from. setup (optional): runs once in each new worktree.
# test (optional): run by the orchestrator after every coder pass. docs: paths searched by search_docs.
repos:
  frontend:
    base: main
    docs: [docs, adr, README.md]
  backend:
    base: main
    docs: [docs, adr, README.md]

# Relative to the workspace.
paths:
  runs: ./runs
  worktrees: ./worktrees

# USD. Token limits count input + output tokens (not cache reads); unset = no token limit.
budget:
  maxCostPerRun: 5
  maxCostPerAgent: 2

# maxRounds: coder passes per task (1 = no fix rounds). testOutputChars: test output tail sent back to a coder.
review:
  maxRounds: 3
  testOutputChars: 2000
  contextChars: 4000      # coder notes and ignored-file contents shown to the reviewer

# BM25 search index per repo (sourcerer index), used to add likely relevant files to coder prompts.
# Built from the base branch; worktree changes are overlaid at query time.
rag:
  enabled: true
  maxFileBytes: 500000            # bigger files are skipped
  exclude: [node_modules/, vendor/, dist/, build/, .git/, '*.min.js', '*.map', '*.lock', package-lock.json, pnpm-lock.yaml, composer.lock, go.sum]
  context:
    maxFiles: 8                   # files added to each coder prompt
    maxChars: 12000               # total snippet size per prompt
    snippetLines: 60

# Limits for the built-in tools used by API agents (openai-compat, anthropic).
tools:
  maxOutputChars: 20000
  runCommand:
    allow: [npm, npx, node, git]
    timeoutSec: 300

# USD per 1M tokens, keyed by model name. Models whose CLI/API does not report cost need a row, else cost is unknown.
pricing: {}

# Profiles with a <model> placeholder need a model before use (sourcerer models add / sourcerer use --model).
llms:
  claude-strong:
    type: cli
    bin: claude
    provider: anthropic
    model: opus           # alias from `claude --help`
    capabilities: { editsFiles: true, toolUse: true, jsonOutput: true, reportsCost: true }

  claude-cheap:
    type: cli
    bin: claude
    provider: anthropic
    model: sonnet         # alias from `claude --help`
    capabilities: { editsFiles: true, toolUse: true, jsonOutput: true, reportsCost: true }

  codex-main:
    type: cli
    bin: codex
    provider: openai
    model: <model>
    capabilities: { editsFiles: true, toolUse: true, jsonOutput: true }

  # Model ids: `cursor-agent models`. provider is the vendor behind the model (xai for Grok).
  # Cursor reports tokens but no cost: add the model under pricing or cost stays unknown.
  cursor-main:
    type: cli
    bin: cursor-agent
    provider: xai
    model: grok-4.7-medium
    capabilities: { editsFiles: true, toolUse: true, jsonOutput: true }

  gpt-api:
    type: openai-compat
    provider: openai
    baseURL: https://api.openai.com/v1
    keyEnv: OPENAI_API_KEY
    model: <model>
    maxOutputTokens: 8192
    capabilities: { toolUse: true, jsonOutput: true }

  claude-api:
    type: anthropic
    provider: anthropic
    keyEnv: ANTHROPIC_API_KEY
    model: <model>
    maxOutputTokens: 8192
    capabilities: { editsFiles: true, toolUse: true, jsonOutput: true }
